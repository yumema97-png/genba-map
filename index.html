<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2f36">
<meta name="apple-mobile-web-app-title" content="現場マップ">
<title>現場マップ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f3f1ec;--panel:#fff;--fg:#22251f;--muted:#6c6f66;--line:#ddd9ce;--red:#d64541;--yel:#e0a82e;--blu:#2f6fba;--gry:#8a8d84;--non:#cfcbc0;--done:#b9b6ad;--acc:#2b2f36;--font:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-size:14px}
button,select,input,textarea{font:inherit}
header{background:var(--acc);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0 4px 0 0;font-weight:700}
.chip{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;user-select:none;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.off{opacity:.35}
.chip.tog.on{background:#fff;color:var(--acc)}
header input[type=search]{flex:1;min-width:90px;border:0;border-radius:6px;padding:4px 8px;font-size:13px}
header select{border:0;border-radius:6px;padding:4px 6px;font-size:12px;max-width:120px}
#map{flex:1;min-height:0}
.pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);position:relative}
.pin.visited{opacity:.55}
.pin.visited::after{content:"✓";position:absolute;inset:0;transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:14px}
.pin.flag{border-color:#22251f;border-width:2px;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.5)}
.pwrap{position:relative}
.ptag{position:absolute;left:15px;top:-14px;white-space:nowrap;background:#22251f;color:#fff;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.pin.non{border-style:dashed;border-color:#555;background:#fff}
.fire{width:22px;height:22px;border-radius:5px;background:#fff;border:2px solid #b3261e;color:#b3261e;font-size:12px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .2s;display:flex;flex-direction:column;z-index:1000;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none}
#sheet .hd{padding:10px 14px 6px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px}
#sheet .hd .t{font-size:17px;font-weight:700;flex:1;min-width:0}
#sheet .hd .t small{display:block;font-size:12px;color:var(--muted);font-weight:400}
#sheet .close{border:0;background:#eee;border-radius:50%;width:30px;height:30px;font-size:16px}
#sheet .bd{overflow:auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:12px}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sec h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv b{font-weight:600;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flags span{font-size:11px;padding:2px 7px;border-radius:4px;background:#eee;color:#999}
.flags span.on{background:#dfeedc;color:#2a6b2e;font-weight:600}
.flags span.tap{cursor:pointer;user-select:none;padding:4px 9px;font-size:12px;min-width:44px;text-align:center;border:1px solid transparent}
.flags span.na{background:#eceae4;color:#77786f}
.flags span.tri{background:#fbefd2;color:#8a5a00;font-weight:600}
.flags span.app{border-color:var(--blu)}
.motobar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.motobar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.motobar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
body.meet header .chip[data-c],body.meet #unvisited{display:none}
#admin{display:none}body.meet #admin{display:inline-flex}
.adm{width:100%;border-collapse:collapse;font-size:13px}.adm th,.adm td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.adm input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;font-family:ui-monospace,Consolas,monospace}
.adm td.b{white-space:nowrap;text-align:right}
/* 職人のアカウント：見る＋訪問記録だけ。追加・編集・位置・図面の保存/削除・物件情報の保存は出さない */
body.worker #addsite,body.worker #x_loc,body.worker #x_edit,body.worker #x_del,body.worker #dwdrop,body.worker .dwdel,body.worker #e_save,body.worker button.clr,body.worker #worker,body.worker .flagnote{display:none!important}
body.worker .flags span.tap{cursor:default}
/* 会議用は会議室の画面で見るので大きく（印刷は下の @media print のまま） */
@media screen{
  body.meet .motobar button{font-size:16px;padding:7px 14px}
  body.meet .sumline{font-size:18px;padding:10px 16px}
  body.meet .sumline .pnote{font-size:13px}
  body.meet .pvwrap{padding:14px 16px}
  body.meet .pvtitle{font-size:20px;margin-bottom:10px}
  body.meet table.pv{width:100%;font-size:21px}
  body.meet table.pv th,body.meet table.pv td{padding:9px 10px}
  body.meet table.pv td.num{min-width:76px}
  body.meet table.pv td.num small{font-size:14px}
  body.meet .pvwrap .pnote{font-size:14px}
  body.meet table.lt{font-size:16px}
  body.meet table.lt th{font-size:15px}
  body.meet table.lt td{padding:9px 10px}
  body.meet table.lt .fl{font-size:13px}
  body.meet .item{font-size:16px}
}
.motobar button.print{margin-left:auto;background:var(--blu);color:#fff;border-color:var(--blu)}
.sumline{padding:6px 14px;font-size:13px;border-bottom:1px solid var(--line);background:#fffbea}
.sumline .pnote{color:var(--muted);font-size:11px;margin-left:8px}
table.lt td.num{text-align:right;font-variant-numeric:tabular-nums}
.pvwrap{padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.pvtitle{font-size:13px;font-weight:700;margin-bottom:6px}
table.pv{border-collapse:collapse;font-size:12px;white-space:nowrap}
table.pv th,table.pv td{border:1px solid var(--line);padding:4px 7px}
table.pv thead th{background:#ece9df;color:var(--muted);font-weight:600}
table.pv tbody th{text-align:left;background:#f6f4ee;font-weight:600}
table.pv td.num{text-align:right;font-variant-numeric:tabular-nums;min-width:52px;line-height:1.25}
table.pv td.num small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.pvwrap .pnote{font-size:11px;color:var(--muted)}
table.pv .tot,table.pv tr.tot th,table.pv tr.tot td{font-weight:700;background:#fffbea}
table.pv tr.sel th{background:#dfe8f6}
/* 会議用の印刷：一覧の表だけをA4横で */
@media print{
  @page{size:A4 landscape;margin:10mm}
  header,#map,#sheet,#toast,#login,.item,.motobar,.sumline .pnote{display:none!important}
  body{display:block;background:#fff;height:auto}
  #listpage{display:block!important;overflow:visible}
  table.lt{display:table!important;font-size:10px}
  table.lt th{position:static;background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.lt td{padding:3px 5px;white-space:normal}
  table.lt tr{break-inside:avoid}
  .dot,.sumline,table.pv th,table.pv td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pvwrap{overflow:visible;break-after:auto}
  table.pv{font-size:10px}
}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-size:12px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted)}
input[type=date],select.f,textarea,input.f{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{min-height:60px;resize:vertical}
input[type=time]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.row.dt{flex-wrap:nowrap}.row.dt label{width:96px;flex:none}.row.dt input[type=date]{flex:1;min-width:0;width:auto}.row.dt input[type=time]{width:92px;flex:none}
button.clr{border:0;background:#eee;border-radius:50%;width:26px;height:26px;flex:none;color:var(--muted)}
button.del{float:right;border:1px solid var(--line);background:#fff;color:var(--red);border-radius:6px;font-size:12px;padding:4px 10px;margin-left:8px}
#who{cursor:pointer}#who:empty{display:none}
.btn.sm{padding:5px 10px;font-size:12px}.btn.danger{color:var(--red)}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;background:#e6eefb;color:var(--blu);font-weight:600}
label.fl2{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-bottom:8px}
label.fl2 textarea{min-height:44px}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:600}
.btn.sub{background:#e9e6dd;color:var(--fg)}
.btn:disabled{opacity:.5}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .v{border-left:3px solid var(--line);padding:2px 10px}
.hist .v:first-child{border-color:var(--acc)}
.hist .v .d{font-size:12px;color:var(--muted)}
.hist .v .s{font-weight:600}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:#eee}
.gps{font-size:12px;color:var(--muted)}
a.ext{color:var(--blu);font-weight:600;text-decoration:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{background:#fff;padding:22px;border-radius:12px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
#login h2{margin:0 0 4px;font-size:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:3000;pointer-events:none}
#toast.show{opacity:1}
/* タブ */
.tabs{display:flex;gap:2px;margin-right:6px}
.tabs span{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.7)}
.tabs span.on{background:#fff;color:var(--acc);font-weight:700}
body.list #map{display:none}
#listpage{display:none;flex:1;overflow:auto;background:var(--panel)}
body.list #listpage{display:block}
/* 一覧：スマホはカード */
.item{padding:8px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;cursor:pointer}
.item:hover{background:#f6f4ee}
.item .dot{width:10px;height:10px;border-radius:50%}
.item small{display:block;color:var(--muted)}
.item .ym{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.item .ym b{display:block;color:var(--fg)}
table.lt{display:none;border-collapse:collapse;width:100%;font-size:13px}
table.lt th{position:sticky;top:var(--mb,0);z-index:1;background:#ece9df;text-align:left;padding:6px 8px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
table.lt td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
table.lt tr{cursor:pointer}table.lt tbody tr:hover{background:#f6f4ee}
table.lt td.w{white-space:normal;min-width:160px}
table.lt .fl{font-size:11px;color:#2a6b2e}
/* PC：一覧は表、詳細は右パネル */
@media (min-width:900px){
  .item{display:none} table.lt{display:table}
  #sheet{left:auto;top:var(--hh,0);bottom:0;width:440px;max-height:none;border-radius:0;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
}
/* スマホ：日付欄が狭くならないよう、見出しを上の段に */
@media (max-width:600px){
  .row.dt{flex-wrap:wrap}.row.dt label{width:100%}
  header .chip{padding:5px 10px}
}
.leaflet-tooltip{white-space:normal;max-width:220px}
table.lt td.nm{white-space:normal;min-width:9em;max-width:18em}
small.sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.flags span.ro{background:none;color:var(--muted);padding-left:4px}
.imp{display:block;font-size:10px;font-weight:400;opacity:.75;line-height:1.1}
.impline{padding:5px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.ptag.b{background:#5b3f86}
.dwlist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.dw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dw a{color:var(--blu);font-weight:600;text-decoration:none;word-break:break-all}
.dw small{color:var(--muted);font-size:11px}
.dw button.del{float:none;margin-left:auto}
.dwdrop{display:block;border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:#faf9f6}
.dwdrop.over{border-color:var(--blu);background:#e6eefb;color:var(--blu)}
.dwdrop.busy{border-color:var(--yel);color:#8a5a00}
.pdfmark{font-size:11px;color:var(--muted);font-weight:400}
#pickbar{display:none;position:fixed;left:50%;top:calc(var(--hh,60px) + 10px);transform:translateX(-50%);z-index:1500;background:#22251f;color:#fff;padding:8px 10px 8px 14px;border-radius:10px;gap:10px;align-items:center;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#pickbar button{border:0;border-radius:6px;padding:5px 10px;background:#fff;color:#22251f;font-weight:600}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="login"><form id="loginf">
  <h2>現場マップ</h2>
  <label>パスワード<input id="l_pw" class="f" type="password" autocomplete="current-password"></label>
  <label>記録者<select id="l_user" class="f"></select></label>
  <div style="font-size:11px;color:var(--muted)">個人のパスワードを持っている人は、記録者は自動で決まります</div>
  <button class="btn" type="submit">開く</button>
  <div id="l_msg" style="color:var(--red);font-size:12px"></div>
</form></div>

<header>
  <h1>現場マップ<small id="impinfo" class="imp"></small></h1>
  <div class="tabs"><span class="on" data-t="map">地図</span><span data-t="list">一覧</span></div>
  <span class="chip" data-c="赤"><i class="dot" style="background:var(--red)"></i>60日 <b></b></span>
  <span class="chip" data-c="黄"><i class="dot" style="background:var(--yel)"></i>90日 <b></b></span>
  <span class="chip" data-c="青"><i class="dot" style="background:var(--blu)"></i>120日 <b></b></span>
  <span class="chip" data-c="灰"><i class="dot" style="background:var(--gry)"></i>以降 <b></b></span>
  <span class="chip" data-c="消検済" title="消防検査は済み、建築確認検査がまだ（建確日が未入力も含む）"><i class="dot" style="background:#8e6bb8"></i>消検済 <b></b></span>
  <span class="chip off" data-c="未定"><i class="dot" style="background:var(--non)"></i>未定 <b></b></span>
  <span class="chip off" data-c="完成済"><i class="dot" style="background:var(--done)"></i>完成済 <b></b></span>
  <span class="chip tog" id="unvisited">未訪問のみ</span>
  <span class="chip tog" id="firechip">消防署</span>
  <select id="moto"><option value="">元請：全部</option></select>
  <select id="worker"><option value="">職人：全員</option></select>
  <input type="search" id="q" placeholder="現場名・正式名称で検索">
  <span class="chip" id="addsite">＋物件</span>
  <span class="chip" id="reload">更新</span>
  <span class="chip" id="admin" title="職人とパスワードの管理（会議用パスワードのときだけ）">⚙管理</span>
  <span class="chip" id="who" title="記録者を切り替える"></span>
</header>
<div id="map"></div>
<div id="pickbar"><span>地図をタップして位置を決めてください</span><button id="pickcancel">やめる</button></div>
<div id="listpage"></div>

<div id="sheet">
  <div class="hd"><div class="t" id="s_title"></div><button class="close" id="s_close">×</button></div>
  <div class="bd" id="s_body"></div>
</div>
<div id="toast"></div>

// Supabase の関数を呼ぶ
async function rpc(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || `通信エラー（${r.status}）`);
  return j;
}
// GAS（写真・図面のドライブ保存）
async function gas(body) {
  body.pw = store.get('pw');
  const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || '失敗'); return j;
}
// 書き込み。action と中身は GAS 版と同じ（Supabase の act 関数が受ける）
async function post(body) {
  const { action, ...b } = body;
  if (action === 'visit' && (b.photos || []).filter(Boolean).length) {
    // 写真は先にドライブへ（GAS）。返ってきたIDを記録に付ける
    b.photoIds = (await gas({ action: 'sbPhotos', site: b.site, photos: b.photos.filter(Boolean) })).ids;
  }
  delete b.photos;
  if (action === 'addDrawing') {
    const f = (await gas({ action: 'sbDrawing', site: b.site, name: b.name, data: b.data })).file;
    b.id = f.id; b.name = f.name; b.kb = f.kb; delete b.data;
  }
  if ((action === 'addSite' || action === 'setLocation') && b.lat == null) {
    // 住所から位置を出す（国土地理院の住所検索）。住所が空なら現場名から推定
    if (action === 'addSite' && !b.addr) b.addr = nameToAddress(norm(b.name));
    const g = b.addr ? await geocodeAddr(b.addr) : null;
    if (g) { b.lat = g.lat; b.lng = g.lng; }
  }
  if (action === 'addSite') b.name = norm(b.name);
  const j = await rpc('act', { p_pw: store.get('pw'), p_user: store.get('user') || '', p_action: action, p_body: b });
  if (!j.ok) throw new Error(j.error || '失敗');
  return j;
}
async function geocodeAddr(addr) {
  try {
    const a = await (await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(addr))).json();
    if (a && a.length) return { lat: a[0].geometry.coordinates[1], lng: a[0].geometry.coordinates[0] };
  } catch (e) {}
  return null;
}
// 全角英数→半角、全角スペース→半角（GAS版の norm と同じ）
function norm(s) { return String(s ?? '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/　/g, ' ').trim(); }
// 現場名 → 住所（GAS版の nameToAddress と同じ。札幌の条丁目表記を読む。読めなければ ''）
const KU = { '美園': '豊平区', '平岸': '豊平区', '月寒西': '豊平区', '月寒東': '豊平区', '中の島': '豊平区', '西岡': '豊平区', '福住': '豊平区', '豊平': '豊平区',
  '東札幌': '白石区', '菊水': '白石区', '発寒': '西区', '二十四軒': '西区', '西野': '西区', '新琴似': '北区', '澄川': '南区', '宮の森': '中央区',
  '厚別中央': '厚別区', '宮の沢': '手稲区', '手稲本町': '手稲区', '本町': '東区' };
function nameToAddress(name) {
  let n = norm(name), m;
  if (/^(千歳市|恵庭市|北広島市|江別市)/.test(n)) return '北海道' + n.replace(/(MS|マンション|賃貸MS|の集合住宅|ホテル|PROJECT|計画).*$/, '').replace(/\s*[A-D]棟$/, '');
  n = n.replace(/^(GA-|PS-|LE-|NUTS-|CORE-|CORE )/, '');
  n = n.replace(/(MS|BL)?\s*(②|ⅲ|Ⅲ|\(A棟\)|\(B棟\)|[A-D]棟|東棟|西棟|賃貸MS|賃貸|の集合住宅|マンション|HOTEL|ホテル|学生寮|民泊|MS).*$/, '').trim();
  const kuFor = (ns, j, ew) => ns === '南' ? '中央区' : ew === '東' ? (j >= 6 ? '東区' : '中央区') : (j >= 10 ? '北区' : '中央区');
  if ((m = /^([SN])(\d+)([EW])(\d+)/.exec(n))) { const ns = m[1] === 'S' ? '南' : '北', ew = m[3] === 'E' ? '東' : '西'; return `北海道札幌市${kuFor(ns, +m[2], ew)}${ns}${m[2]}条${ew}${m[4]}丁目`; }
  if ((m = /^([南北])\s*(\d+)\s*条?\s*([東西])\s*(\d+)/.exec(n))) return `北海道札幌市${kuFor(m[1], +m[2], m[3])}${m[1]}${m[2]}条${m[3]}${m[4]}丁目`;
  if ((m = /^(麻生町?)\s*(\d+)/.exec(n))) return `北海道札幌市北区麻生町${m[2]}丁目`;
  if ((m = /^(本通|本郷通|南郷通)り?\s*(\d+)丁目?\s*([南北])?/.exec(n))) return `北海道札幌市白石区${m[1]}${m[2]}丁目${m[3] || ''}`;
  if ((m = /^(栄通|西町北|厚別南|青葉町)\s*(\d+)/.exec(n))) return `北海道札幌市${{ '栄通': '白石区', '西町北': '西区', '厚別南': '厚別区', '青葉町': '厚別区' }[m[1]]}${m[1]}${m[2]}丁目`;
  if ((m = /^白石中央\s*(\d+)-(\d+)/.exec(n))) return `北海道札幌市白石区中央${m[1]}条${m[2]}丁目`;
  if ((m = /^月寒中央通\s*(\d+)/.exec(n))) return `北海道札幌市豊平区月寒中央通${m[1]}丁目`;
  if ((m = /^([一-龥ぁ-んァ-ンの]+?)\s*(\d+)\s*(?:-|条)\s*(\d+)/.exec(n))) return `北海道札幌市${KU[m[1]] || ''}${m[1]}${m[2]}条${m[3]}丁目`;
  if (/^中央区/.test(n)) return '北海道札幌市' + n;
  return '';
}
async function sendVisit(s) {

// ドロップ（PC）・選択（スマホ）で保存。開くときはアプリ経由で取り出す（ドライブの共有リンクは作らない）
function bindDrawings(s) {
  const drop = $('#dwdrop'), input = $('#dwfile');
  input.onchange = () => { uploadDrawings(s, [...input.files]); input.value = ''; };
  // パネルのどこに落としても受け取る（ブラウザがPDFを開いてしまわないように）
  const body = $('#s_body');
  body.ondragover = e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); drop.classList.add('over'); } };
  body.ondragleave = e => { if (!body.contains(e.relatedTarget)) drop.classList.remove('over'); };
  body.ondrop = e => { if (!e.dataTransfer?.files?.length) return; e.preventDefault(); drop.classList.remove('over'); uploadDrawings(s, [...e.dataTransfer.files]); };
  body.querySelectorAll('a.dwopen').forEach(a => a.onclick = e => { e.preventDefault(); openDrawing(a.dataset.id, a.textContent); });
  body.querySelectorAll('button.dwdel').forEach(b => b.onclick = () => delDrawing(b.dataset.id, b.dataset.n));

// パネルの外（地図など）に落としたとき、ブラウザがPDFを開いてアプリから離れてしまうのを止める
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { if (!$('#s_body').contains(e.target)) { e.preventDefault(); if (e.dataTransfer?.files?.length) toast('図面は物件の詳細パネルに落としてください'); } });
const readB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(f); });
async function uploadDrawings(s, files) {
  const pdfs = files.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!pdfs.length) return toast('PDFだけ保存できます');
  const big = pdfs.find(f => f.size > 25 * 1024 * 1024); if (big) return toast(`${big.name} は大きすぎます（25MBまで）`);
  const drop = $('#dwdrop'); drop.classList.add('busy');
  let ok = 0;
  for (const f of pdfs) {
    drop.firstChild.textContent = `保存中… ${f.name}（${ok + 1}/${pdfs.length}）`;
    try { await post({ action: 'addDrawing', site: s['現場名'], name: f.name, data: await readB64(f) }); ok++; }
    catch (e) { toast(`${f.name} を保存できません：${e.message}`); }
  }
  toast(`図面を${ok}件保存しました`); await load(true);
}

  return { fire: $('#e_fire').value + ' ' + $('#e_fireT').value, bldg: $('#e_bldg').value + ' ' + $('#e_bldgT').value, prog: $('#e_prog').value.trim(), alias: $('#e_alias').value.trim() };
}
// 開いたときから変わった項目だけ（送信用）。入力欄が無ければ null
function extraChanged() {
  const now = extraValues(); if (!now || !extraInit) return null;
  const b = {};
  if (now.fire !== extraInit.fire) { b.fireDate = $('#e_fire').value; b.fireTime = $('#e_fireT').value; }
  if (now.bldg !== extraInit.bldg) { b.bldgDate = $('#e_bldg').value; b.bldgTime = $('#e_bldgT').value; }
  if (now.prog !== extraInit.prog) b.progress = now.prog;
  if (now.alias !== extraInit.alias) b.alias = now.alias;
  return b;
}
async function saveExtra(s) {

  const btn = $('#e_save'); btn.disabled = true;
  try {
    // 変えた項目だけ送る（開きっぱなしの間に別の人が入れた値を、古い値で戻さない）
    await post({ action: 'extra', site: s['現場名'], ...changed });

  } catch (e) { toast('保存失敗：' + e.message); btn.disabled = false; }
}
// ===== 図面〜下検査の切り替え =====
const FLAG_CYCLE = ['', '〇', '／', '△'];
// 搬入も同じ並びで切り替える（保存先は物件追加の「搬入」列。Excelには無い項目）
const FLAG_CLS = { '〇': 'on', '／': 'na', '△': 'tri' };
const flagVal = (s, f) => f === '搬入' ? normF(s.ex['搬入']) : normF(s[f]);
function flagSpans(s) {
  return FLAGS.concat('搬入').map(f => { const v = flagVal(s, f); return `<span class="tap ${FLAG_CLS[v] || ''}${s['アプリ_' + f] ? ' app' : ''}" data-f="${f}">${f}${esc(v)}</span>`; }).join('');
}
// 送る待ちの切り替え（0.8秒まとめ）。パネルを閉じる・別の物件を開くときはすぐ送る
const flagTimers = {};
function flushFlags() { Object.keys(flagTimers).forEach(k => { const t = flagTimers[k]; delete flagTimers[k]; clearTimeout(t.id); t.fn(); }); }
function bindFlags(s) {
  if (WORKER) return; // 職人は見るだけ
  $('#flags').querySelectorAll('span.tap').forEach(el => el.onclick = () => {
    const f = el.dataset.f;
    const nx = FLAG_CYCLE[(FLAG_CYCLE.indexOf(flagVal(s, f)) + 1) % FLAG_CYCLE.length];
    if (f === '搬入') {
      // 搬入は物件追加に保存。元データ（DATA.extra）も直して、再描画で戻らないようにする
      s.ex['搬入'] = nx;
      let e = (DATA.extra || []).find(x => x['現場名'] === s['現場名']); if (!e) { e = { '現場名': s['現場名'] }; (DATA.extra = DATA.extra || []).push(e); } e['搬入'] = nx;
    } else {
      if (!(('元_' + f) in s)) s['元_' + f] = String(s[f] || ''); // Excelの値（最初の1回だけ控える）
      s[f] = nx; s['アプリ_' + f] = nx !== normF(s['元_' + f]) ? 1 : 0;
      // 元データ（DATA.sites）にも反映して、一覧や再描画で戻らないようにする
      const raw = DATA.sites.find(x => x['現場名'] === s['現場名']); if (raw) { raw[f] = nx; raw['元_' + f] = s['元_' + f]; raw['アプリ_' + f] = s['アプリ_' + f]; }
    }
    $('#flags').innerHTML = flagSpans(s); bindFlags(s);
    // 続けてタップしても最後の値だけ送る
    const key = s['現場名'] + '|' + f;
    if (flagTimers[key]) clearTimeout(flagTimers[key].id);
    const req = f === '搬入' ? { action: 'extra', site: s['現場名'], delivery: nx } : { action: 'setFlag', site: s['現場名'], key: f, value: nx };
    const fn = () => { delete flagTimers[key]; post(req)
      .then(() => { saveCache(); toast(`${f}：${nx || '空欄'} を保存しました`); renderList(); })
      .catch(e => toast(`${f} の保存に失敗：` + e.message)); };
    flagTimers[key] = { id: setTimeout(fn, 800), fn };
  });
}

function shrink(file) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => res(null); img.src = url;
  });
}

    if (r === 'auth') showLogin(); else locate();
  } else showLogin();
})();
// 記録者の名前は設定シートにあり、ログイン画面を開いたときにパスワードなしで取る
async function fetchUsers() {
  try {
    const j = await rpc('users', {});
    if (j.ok && j.users) { store.set('users', j.users.join(',')); fillUsers(j.users); }
  } catch (e) {}
}
function fillUsers(list) {
  const sel = $('#l_user'), prev = sel.value; sel.innerHTML = '';
  if (list && list.length) { sel.add(new Option('選んでください', '')); list.forEach(u => sel.add(new Option(u))); }
  else sel.innerHTML = '<option value="">（読み込み中…）</option>';
  const keep = prev || store.get('user');
  if (keep && list && list.includes(keep)) sel.value = keep;
}
function showLogin() {
  pending = null; // 前に確かめた結果（古いデータ）を使い回さない
  $('#l_user').disabled = false;
  $('#login').style.display = 'flex';
  const cached = store.get('users'); fillUsers(cached ? cached.split(',') : null);
  if (store.get('pw')) $('#l_pw').value = store.get('pw');
  fetchUsers();
}
var pending = null; // パスワード確認の結果（{pw, j}）。init より前に使うので var（let だと宣言前に触れてエラー）
async function checkPw() {
  const pw = $('#l_pw').value; if (!pw) return null;
  if (pending && pending.pw === pw) return pending.j;
  $('#l_msg').textContent = '';
  const j = await rpc('load', { p_pw: pw });
  if (!j.ok) { $('#l_msg').textContent = j.error; return null; }
  pending = { pw, j };
  if (j.role === 'worker') { fillUsers([j.me]); $('#l_user').value = j.me; $('#l_user').disabled = true; } // 個人のパスワードなら記録者は本人に決まる
  else { $('#l_user').disabled = false; store.set('users', j.users.join(',')); fillUsers(j.users); }
  return j;
}
$('#l_pw').onchange = () => checkPw().catch(() => $('#l_msg').textContent = '通信エラー');
$('#loginf').onsubmit = async e => {
  e.preventDefault();
  try {
    const j = await checkPw(); if (!j) return;
    const user = j.role === 'worker' ? j.me : $('#l_user').value;
    if (!user) { $('#l_msg').textContent = '記録者を選んでください'; return; }
    store.set('pw', $('#l_pw').value); store.set('user', user); DATA = j; pending = null; saveCache();
    $('#login').style.display = 'none'; $('#who').textContent = '👤 ' + user; build(); setHH(); locate();
  } catch (err) { $('#l_msg').textContent = '通信エラー'; }
};
$('#who').onclick = () => showLogin();

// ===== ほかの人の変更をすぐ反映（Supabase のリアルタイム） =====
// サーバーは「変わった」とだけ知らせてくる（中身は流れない）。受けたら少し待ってから読み直す
let liveTimer = null;
function liveReload() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    if (!store.get('pw') || $('#login').style.display === 'flex') return;
    if (isEditing() || Object.keys(flagTimers).length) { liveReload(); return; } // 入力の途中・切り替えの送信待ちは後回し
    await load(true);
  }, 1500);
}
try {
  const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  sb.channel('genba-map').on('broadcast', { event: 'changed' }, liveReload).subscribe(st => console.log('realtime', st));
} catch (e) { console.warn('リアルタイム更新を使えません', e); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DATA) liveReload(); });
</script>
